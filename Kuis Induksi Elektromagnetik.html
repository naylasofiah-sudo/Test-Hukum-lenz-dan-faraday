<head>

<title>Kuis Induksi Elektromagnetik</title>
<style>
:root{--bg:#f3f8ff;--card:#fff;--ink:#1b2a41;--mute:#5a6b85;--line:#d5e1f2;--pri:#2f6fed;--pri-ink:#fff;--ok:#1a9a5b;--okbg:#e4f7ec;--mid:#b87500;--midbg:#fff3d6;--bad:#d63b4b;--badbg:#fde8ea;--acc:#7a4fe0;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1727;--card:#182338;--ink:#e8eefb;--mute:#9db0cf;--line:#2c3c5a;--pri:#6c9bff;--pri-ink:#0b1220;--ok:#4cd08a;--okbg:#12362a;--mid:#f0b63c;--midbg:#3a2f12;--bad:#ff7b88;--badbg:#3d1a20;--acc:#a98cff}}
:root[data-theme="dark"]{--bg:#0f1727;--card:#182338;--ink:#e8eefb;--mute:#9db0cf;--line:#2c3c5a;--pri:#6c9bff;--pri-ink:#0b1220;--ok:#4cd08a;--okbg:#12362a;--mid:#f0b63c;--midbg:#3a2f12;--bad:#ff7b88;--badbg:#3d1a20;--acc:#a98cff}
html[data-contrast="1"]{--bg:#000;--card:#000;--ink:#fff;--mute:#fff;--line:#fff;--pri:#ffe600;--pri-ink:#000;--ok:#00ff7f;--okbg:#000;--mid:#ffe600;--midbg:#000;--bad:#ff6b6b;--badbg:#000;--acc:#00e5ff}
html[data-contrast="1"] .card,html[data-contrast="1"] .opt,html[data-contrast="1"] button,html[data-contrast="1"] input,html[data-contrast="1"] select{border-width:2px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 60px}
header.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0}
.brand{font-weight:800;font-size:1.15rem;display:flex;gap:8px;align-items:center}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:42px}
button:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.small{min-height:34px;padding:4px 10px;font-size:.9rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.3rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:.2em 0}
.mute{color:var(--mute)}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:44px}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.test{text-align:left;padding:16px;border-radius:16px;display:block;width:100%}
.test .ic{font-size:2rem}
.test.sel{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);transition:width .25s}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:14px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800}
.opt[aria-checked="true"]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.opt[aria-checked="true"] .k{background:var(--pri);color:var(--pri-ink)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nav button{min-width:40px;padding:4px 8px;min-height:38px}
.nav .cur{border-color:var(--pri);border-width:3px}.nav .done{background:color-mix(in srgb,var(--pri) 20%,var(--card))}
.pill{padding:3px 11px;border-radius:99px;font-weight:700;font-size:.85rem;display:inline-block}
.p-ok{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}.p-mid{background:var(--midbg);color:var(--mid);border:1.5px solid var(--mid)}.p-bad{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad)}
.score{font-size:3rem;font-weight:800;line-height:1}
.expl{background:color-mix(in srgb,var(--acc) 10%,var(--card));border-left:5px solid var(--acc);padding:10px 14px;border-radius:10px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.tw{overflow-x:auto}
.stat{padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}.stat b{font-size:1.6rem;display:block}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}.hbar .t{flex:1;height:14px;background:var(--line);border-radius:8px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--bad)}
.tl{border:2px solid;border-radius:14px;padding:12px;margin:10px 0}
.tl.ok{border-color:var(--ok)}.tl.mid{border-color:var(--mid)}.tl.bad{border-color:var(--bad)}
.speech{position:sticky;bottom:8px;z-index:5;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:14px;display:none;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.speech.on{display:flex}
.sr{position:absolute;left:-9999px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;max-width:440px;width:100%}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
@media (max-width:560px){.score{font-size:2.4rem}.wrap{padding:8px 12px 60px}}

:root{--g1:#2f6fed;--g2:#7a4fe0;--c-diag:#0f9d8a;--c-pre:#e08a00;--c-post:#7a4fe0;--sh:0 6px 22px rgba(47,111,237,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 6px 22px rgba(0,0,0,.35);--c-diag:#3fd0bb;--c-pre:#f5b13d;--c-post:#a98cff}}
:root[data-theme="dark"]{--sh:0 6px 22px rgba(0,0,0,.35);--c-diag:#3fd0bb;--c-pre:#f5b13d;--c-post:#a98cff}
body{background:radial-gradient(1000px 420px at 85% -120px,color-mix(in srgb,var(--g2) 18%,transparent),transparent),radial-gradient(800px 380px at -10% -100px,color-mix(in srgb,var(--g1) 18%,transparent),transparent),var(--bg)}
header.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line)}
.brand{font-size:1.1rem}.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-size:1.1rem;box-shadow:var(--sh)}
.card{box-shadow:var(--sh);border-radius:20px}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;position:relative;overflow:hidden}
.hero h1,.hero p{color:#fff}.hero .mute{color:rgba(255,255,255,.85)}
.hero:after{content:"⚡";position:absolute;right:14px;top:-18px;font-size:7rem;opacity:.15}
.hero label{color:#fff}.hero input{border-color:transparent}
button.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;color:#fff;box-shadow:var(--sh)}
html[data-contrast="1"] button.pri{background:var(--pri);color:var(--pri-ink)}
html[data-contrast="1"] .hero{background:#000;border:2px solid #fff}
.test{border-width:2px;position:relative;transition:transform .12s}.test:hover{transform:translateY(-2px)}
.test .ic{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;font-size:1.6rem;margin-bottom:6px;background:color-mix(in srgb,var(--ac) 18%,var(--card))}
.test[data-k=diag]{--ac:var(--c-diag)}.test[data-k=pre]{--ac:var(--c-pre)}.test[data-k=post]{--ac:var(--c-post)}
.test.sel{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.test.sel:after{content:"✓";position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800}
.chip{display:inline-block;margin-top:8px;font-size:.78rem;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ink)}
.stat{box-shadow:var(--sh);border-radius:16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac,var(--pri))}
.stat b{font-size:1.9rem}
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet{border:1.5px solid var(--line);border-radius:14px;overflow:auto;max-height:480px;background:var(--card)}
.sheet table{border-collapse:separate;border-spacing:0;font-size:.9rem;min-width:100%}
.sheet th{position:sticky;top:0;background:color-mix(in srgb,var(--pri) 12%,var(--card));z-index:2;white-space:nowrap;border-bottom:2px solid var(--line);border-right:1px solid var(--line)}
.sheet td{border-right:1px solid var(--line);white-space:nowrap}
.sheet tr:nth-child(even) td{background:color-mix(in srgb,var(--pri) 4%,var(--card))}
.sheet td:first-child,.sheet th:first-child{position:sticky;left:0;z-index:1;background:var(--card);font-weight:700}
.sheet th:first-child{z-index:3;background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.sheet .num{text-align:center;font-variant-numeric:tabular-nums}
.cell-ok{background:var(--okbg)!important;color:var(--ok);font-weight:700}.cell-mid{background:var(--midbg)!important;color:var(--mid);font-weight:700}.cell-bad{background:var(--badbg)!important;color:var(--bad);font-weight:700}
.sheet tfoot td{position:sticky;bottom:0;background:color-mix(in srgb,var(--pri) 12%,var(--card))!important;font-weight:700;border-top:2px solid var(--line)}
.mini{display:inline-block;width:26px;text-align:center}
.minibars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:6px 4px 0}
.minibars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.minibars .b i{display:block;width:100%;max-width:70px;border-radius:10px 10px 0 0;background:var(--ac);min-height:3px}
.minibars .b span{font-size:.85rem;margin-top:4px;text-align:center}.minibars .b b{margin-bottom:3px}
.sec{display:flex;gap:8px;align-items:center;margin:22px 0 6px;font-size:1.15rem;font-weight:800}
.sec small{font-weight:500;color:var(--mute);font-size:.85rem}
.gain{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--acc) 10%,var(--card))}
</style>
</head>

<script>
const TESTS={"diag": {"nama": "Tes Diagnostik", "ic": "🔍", "desk": "Cek prasyarat: arus listrik, Hukum Ohm, dan konsep energi.", "menit": 10, "Q": [{"q": "Dalam suatu kawat penghantar, muatan listrik total sebesar 20 Coulomb mengalir selama 4 detik. Besar kuat arus listrik yang mengalir pada kawat tersebut adalah...", "o": ["4 A", "5 A", "8 A", "16 A"], "a": 1, "c": "C2", "i": "Kelistrikan Dasar", "e": "I = Q/t = 20/4 = 5 A."}, {"q": "Sebuah kawat penghantar memiliki hambatan R = 4 Ω. Jika dihubungkan dengan sumber tegangan V = 12 Volt, besar kuat arus listrik yang mengalir adalah...", "o": ["2 A", "3 A", "4 A", "6 A"], "a": 1, "c": "C2", "i": "Kelistrikan Dasar", "e": "Hukum Ohm: I = V/R = 12/4 = 3 A."}, {"q": "Jika hambatan pada suatu rangkaian diperbesar dua kali lipat sementara tegangan tetap, maka kuat arus listrik akan...", "o": ["Menjadi dua kali lebih besar", "Menjadi setengah kali lebih kecil", "Tetap sama", "Menjadi empat kali lebih besar"], "a": 1, "c": "C3", "i": "Kelistrikan Dasar", "e": "Berdasarkan Hukum Ohm, I berbanding terbalik dengan R. Jika R naik 2 kali, I turun menjadi 1/2 kali."}, {"q": "Pada PLTA, air di bendungan memiliki energi potensial. Energi ini diubah menjadi energi kinetik untuk memutar turbin. Alat yang mengubah energi kinetik putaran turbin menjadi energi listrik adalah...", "o": ["Transformator", "Generator", "Galvanometer", "Dinamometer"], "a": 1, "c": "C1", "i": "Konsep Energi", "e": "Generator adalah alat konversi energi mekanik (putaran) menjadi energi listrik."}, {"q": "Perubahan energi utama yang terjadi saat sebuah mobil listrik mengerem (pengereman regeneratif) adalah...", "o": ["Energi kimia menjadi energi listrik", "Energi listrik menjadi energi kinetik", "Energi kinetik menjadi energi listrik", "Energi panas menjadi energi gerak"], "a": 2, "c": "C2", "i": "Konsep Energi", "e": "Motor listrik berbalik fungsi menjadi generator, mengubah energi kinetik menjadi energi listrik."}, {"q": "Alat ukur yang digunakan untuk mendete  try{localStorage.setItem(PREF,JSON.stringify(pref))}catch(e){}}

/* ===== speech ===== */
const TTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
let lastText="";
function stopSpeak(){try{TTS&&speechSynthesis.cancel()}catch(e){}}
function speak(text){
 if(!TTS){toast("Peramban ini belum mendukung suara.");return}
 lastText=text;$("#speech").classList.add("on");
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="id-ID";u.rate=pref.rate;
  const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast("Suara tidak dapat diputar.")}}
$("#spPlay").onclick=()=>{try{if(speechSynthesis.paused)speechSynthesis.resume();else if(lastText)speak(lastText)}catch(e){}};
$("#spPause").onclick=()=>{try{speechSynthesis.pause()}catch(e){}};
$("#spStop").onclick=()=>{stopSpeak();$("#speech").classList.remove("on")};
$("#spRate").onchange=e=>{pref.rate=+e.target.value;applyPref();if(lastText&&TTS&&speechSynthesis.speaking)speak(lastText)};
function toast(m){const d=document.createElement("div");d.setAttribute("role","status");d.style.cssText="position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;max-width:90vw";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

function modal(html,onMount){const m=document.createElement("div");m.className="modal";m.innerHTML='<div role="dialog" aria-modal="true">'+html+'</div>';
 document.body.appendChild(m);const close=()=>m.remove();m.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
 onMount&&onMount(m,close);const f=$("button,input,textarea",m);f&&f.focus();return close}
function confirmBox(msg,yes,cb,danger){modal(`<p>${msg}</p><div class="row"><button class="pri ${danger?"danger":""}" data-y>${yes}</button><button data-n>Batal</button></div>`,(m,c)=>{$("[data-y]",m).onclick=()=>{c();cb()};$("[data-n]",m).onclick=c})}

const mmss=s=>String(Math.floor(Math.max(s,0)/60)).padStart(2,"0")+":"+String(Math.max(s,0)%60).padStart(2,"0");

 modal(`<h2>${esc(title)}</h2><p class="mute">Salin teks di bawah lalu tempel ke Excel / Google Sheets.</p><textarea id="ct" rows="8" readonly style="font-family:monospace;font-size:.8rem">${esc(text)}</textarea><div class="row" style="margin-top:10px"><button class="pri" id="cp">Salin</button><button id="dl">Unduh</button><button id="cl">Tutup</button></div>`,(m,c)=>{
  $("#cl",m).onclick=c;$("#cp",m).onclick=()=>{const t=$("#ct",m);t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Tersalin. Tempel di spreadsheet.":"Tekan Ctrl+C untuk menyalin.")};
  $("#dl",m).onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/plain"}));a.download=fname;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("Unduhan tidak tersedia. Gunakan Salin.")}}})}
function exportCsv(rs){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const head=["id","nama","kelas","jenisTes","skor","kategori","tanggal","jawaban"];
 csvModal("Ekspor riwayat",[head.join(",")].concat(rs.map(r=>[r.id,r.nama,r.kelas,TESTS[r.jenisTes].nama,r.skor,r.kategori,r.tanggal,r.jawaban.map(a=>a<0?"-":LET[a]).join("")].map(q).join(","))).join("\n"),"hasil_kuis_induksi.csv")}
applyPref();render();
try{speechSynthesis.getVoices()}catch(e){}
